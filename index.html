<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- fontawsome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body class="manrope-font">
    <section class="banner flex max-w-[1140px] m-auto">
        <div class="banner-left">
            <h1 class="text-7xl font-extrabold">It's good <br>
                tea time at The <br>
                Tea House</h1>
            <p class="text-[18px] font-medium text-gray-400 my-7">Tea and Botanical Solutions Supplier Give Optimum
                Satisfaction To Your Taste Buds.</p>
            <button class="m-5 bg-gradient-to-r from-[#FF8938] to-[#FF0000] w-48 h-16 rounded-lg text-white">Explore
                More <i class="fa-solid fa-arrow-right -rotate-45"></i></button>
        </div>
        <div class="banner-right relative">
           <span class="relative -bottom-8 h-full"> <img src="./images/banner.png" alt=""></span>
            <div class="rating-card flex items-center gap-1.5 bg-white shadow-2xl py-5 px-7 w-[255px] h-24 rounded-[10px] absolute bottom-0 left-8">
                <i class="fa-solid fa-star text-2xl"></i>
                <div class="rating-card-content">
                    <p class="font-bold">5.00</p>
                    <p>Trust Pilot Ratings</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
